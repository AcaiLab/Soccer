name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install (no torch; tests needing it are skipped)
        run: |
          pip install -r requirements-ci.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -p no:warnings

      # Scans the checked-out files so no new secret can land. History still
      # holds the old Dropbox link until it is rotated and rewritten
      # (docs/leak_audit.md, A).
      - name: Secret scan (current files)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks dir . --redact --no-banner
